[package]
name = "textshot"
version = "0.1.2"
description = "Screen text capture tool"
authors = ["textshot"]
edition = "2021"

[lib]
name = "textshot_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
thiserror = "1"
leptess = "0.14"
ashpd = "0.10"
url = "2"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
